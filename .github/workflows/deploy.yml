name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    # Run checks on all PRs, manual runs, and direct pushes to main.
    # Skip when the push to main is a PR merge commit (since checks already ran on the PR).
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !startsWith(github.event.head_commit.message, 'Merge pull request #')
      )
    steps:
      - name: Check if push came from a Squash-Merged PR
        id: pr_check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_COUNT=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length' 2>/dev/null || echo "0")
          echo "from_pr=$([ "$PR_COUNT" -gt 0 ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.pr_check.outputs.from_pr != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.pr_check.outputs.from_pr != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.pr_check.outputs.from_pr != 'true'
        run: npm ci

      - name: Run ESLint
        if: steps.pr_check.outputs.from_pr != 'true'
        run: npm run lint

      - name: Run TypeScript & Vite build check
        if: steps.pr_check.outputs.from_pr != 'true'
        run: npm run build

  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: check
    # Only deploy on pushes to main (or manual dispatch), and only if `check` succeeded or was skipped (from a PR merge)
    if: >
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.check.result == 'success' || needs.check.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

